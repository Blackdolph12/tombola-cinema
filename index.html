<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TOMBOLA</title><style>body{background:#000;color:#fff;font-family:Arial;margin:0}.g{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px}.c{background:#181818;border-radius:8px;overflow:hidden;border:1px solid #222;position:relative}.c img{width:100%;height:180px;object-fit:cover}.b{position:absolute;top:5px;left:5px;background:#0f0;color:#000;font-size:8px;font-weight:900;padding:2px 5px;border-radius:3px}.t{background:#0f0;color:#000;border:none;width:100%;padding:7px;border-radius:5px;font-weight:900;margin-top:4px}.l{position:fixed;inset:0;background:#000;z-index:99;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:20px;text-align:center}</style></head><body><div id="lk" class="l"><h1 style="color:#0f0">TOMBOLA CINEMA</h1><p>2000 FILMS REAL</p><button onclick="localStorage.setItem('ok','1');document.getElementById('lk').style.display='none'" style="background:#0f0;color:#000;border:none;padding:12px 30px;border-radius:25px;font-weight:900;margin-top:15px">FUNGOLA ▶️</button></div><div class="g" id="g"></div><script>T=["Rambo Lingala","Mama Congo","Batman Kin","Motema Mabe","Bolingo","Mboka","Police Kin","Sila Bisalu"];G=document.getElementById('g');for(i=1;i<=80;i++){let n=T[Math.random()*T.length|0]+" "+i;let im="https://picsum.photos/seed/"+i+"/200/300";G.innerHTML+=`<div class=c><span class=b>LINGALA</span><img src="${im}"><div style=padding:6px><div style=font-size:11px>${n}</div><button class=t onclick="window.open('https://m.youtube.com/results?search_query='+encodeURIComponent('${n} film congolais theatre complet lingala'),'_blank')">▶️ TALA FILM</button></div></div>`}if(localStorage.getItem('ok')=='1')document.getElementById('lk').style.display='none';</script></body></html>
