<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TOMBOLA</title><style>body{background:#000;color:#fff;font-family:Arial;margin:0}.card{background:#181818;border-radius:8px;overflow:hidden;width:32%;display:inline-block;margin:2px;vertical-align:top;position:relative;border:1px solid #222}.card img{width:100%;height:160px;object-fit:cover}.badge{position:absolute;top:4px;left:4px;background:#0f0;color:#000;font-size:8px;font-weight:900;padding:2px 4px;border-radius:3px}.tala{background:#0f0;color:#000;border:none;width:100%;padding:6px;font-weight:900;border-radius:4px;margin-top:4px}.modal{position:fixed;inset:0;background:#000;z-index:99;display:none}.modal iframe{width:100%;height:85%}.lock{position:fixed;inset:0;background:#000;z-index:100;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:20px;text-align:center}</style></head><body>
<div id="lk" class="lock"><h2 style="color:#0f0">TOMBOLA CINEMA</h2><p>2000+ FILMS LINGALA</p><p style="color:#0f0">+243 823 043 089</p><button onclick="document.getElementById('lk').style.display='none';localStorage.setItem('ok','1')" style="background:#0f0;color:#000;border:none;padding:12px 30px;border-radius:25px;font-weight:900;margin-top:15px">FUNGOLA FILMS ▶️</button></div>
<div id="vp" class="modal"><div style="padding:10px;background:#111;display:flex;justify-content:space-between"><span id="vt">Lecture</span><button onclick="document.getElementById('vp').style.display='none';document.getElementById('vf').src=''" style="background:#222;color:#fff;border:1px solid #444;padding:4px 10px;border-radius:10px">✕</button></div><iframe id="vf" allowfullscreen></iframe></div>
<div style="padding:10px" id="grid"></div>
<script>
M=["Rambo Lingala","Bolingo","Mama Congo","Batman Kin","Motema Mabe","Famille","Mboka","Action","Elengi","Police"];I="https://images.unsplash.com/photo-1485846234645-a62644f84728?w=300";G=document.getElementById('grid');for(i=1;i<=60;i++){let t=M[Math.floor(Math.random()*M.length)]+" "+i;G.innerHTML+=`<div class=card><span class=badge>LINGALA</span><img src="${I}&r=${i}"><div style=padding:5px><div style=font-size:10px">${t}</div><button class=tala onclick="play('${t}')">▶️ TALA</button></div></div>`}
function play(t){document.getElementById('vp').style.display='block';document.getElementById('vt').innerText=t;document.getElementById('vf').src="https://www.youtube.com/embed?listType=search&list="+encodeURIComponent(t+" film congolais lingala complet")+"&autoplay=1"}
if(localStorage.getItem('ok')=='1')document.getElementById('lk').style.display='none';
</script></body></html>
