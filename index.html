<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>TOMBOLA 2000</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#000;color:#fff;font-family:Arial}.lock{position:fixed;inset:0;background:#000;z-index:100;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:25px;text-align:center}.code-input{width:100%;max-width:320px;padding:14px;border-radius:8px;border:1px solid #444;background:#111;color:#fff;margin:15px 0;text-align:center;font-size:16px}.unlock-btn{background:#00ff00;color:#000;border:none;padding:14px 40px;border-radius:25px;font-weight:900;font-size:16px;width:100%;max-width:320px}.header{background:#000;padding:10px 15px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #222}.logo{color:#e50914;font-size:22px;font-weight:900}.logo span{color:#00ff00;font-size:12px}.movie-row{display:flex;gap:10px;overflow-x:auto;padding:10px}.movie-card{min-width:120px;width:120px;background:#181818;border-radius:6px;overflow:hidden;position:relative}.movie-card img{width:100%;height:170px;object-fit:cover}.badge{position:absolute;top:5px;left:5px;background:#00ff00;color:#000;font-size:8px;font-weight:900;padding:2px 4px;border-radius:3px}.grid-all{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px}</style></head><body><div class="header"><div class="logo">TOMBOLA<span> 🇨🇩 2000 FILMS</span></div></div><div id="rows"></div><div class="grid-all" id="grid"></div><div id="lockScreen" class="lock"><h1 style="color:#00ff00">🔒 TOMBOLA CINEMA</h1><h2 style="margin:10px 0">2000+ FILMS NA LINGALA</h2><p style="color:#aaa;font-size:13px">Bofuta 5,000 FC na M-Pesa</p><p style="color:#00ff00;font-weight:bold;margin-top:8px">+243 823 043 089</p><input id="codeInput" class="code-input" value="TMB-1234"><button class="unlock-btn" onclick="document.getElementById('lockScreen').style.display='none';localStorage.setItem('t','1');alert('2000 FILMS EFUNGWAMI! 🇨🇩')">FUNGOLA 2000 FILMS ▶️</button><p onclick="document.getElementById('lockScreen').style.display='none';localStorage.setItem('t','1')" style="color:#00ff00;margin-top:15px;text-decoration:underline">👉 TAP ICI - DEMO GRATUIT</p></div><script>const T=["Action","Bolingo","Congo War","Fast Kin","Love Congo","Nzambe","Mboka","Rambo Lingala","Batman Kin","Superman","Nollywood","Guerre","Motema Mabe","Elengi","Bana Kin","Mama Congo"];let M=[];for(let i=1;i<=2000;i++){M.push({t:T[Math.floor(Math.random()*T.length)]+" "+i, p:"https://picsum.photos/200/300?random="+i})}function render(){let g=document.getElementById('grid');let r=document.getElementById('rows');r.innerHTML="<h3 style='padding:10px'>🔥 Films ya Sika - 2000+ Lingala</h3><div class='movie-row'>"+M.slice(0,20).map(m=>`<div class='movie-card'><span class='badge'>LINGALA</span><img src='${m.p}'><div style='padding:5px;font-size:10px'>${m.t}</div></div>`).join('')+"</div>";g.innerHTML=M.slice(0,60).map(m=>`<div class='movie-card'><span class='badge'>LINGALA</span><img src='${m.p}'><div style='padding:5px;font-size:9px'>${m.t}<br><button style='background:#00ff00;border:none;width:100%;margin-top:3px;border-radius:3px;font-size:9px'>▶️ TALA</button></div></div>`).join('');}render();if(localStorage.getItem('t')=='1'){document.getElementById('lockScreen').style.display='none';}</script></body></html>
