<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TOMBOLA REAL MOVIES</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#000;color:#fff;font-family:Arial}.lock{position:fixed;inset:0;background:#000;z-index:90;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:20px;text-align:center}.code{width:100%;max-width:300px;padding:12px;border-radius:8px;border:1px solid #444;background:#111;color:#fff;text-align:center;margin:12px 0}.unlock{background:#0f0;color:#000;border:none;padding:12px;border-radius:25px;font-weight:900;width:100%;max-width:300px}.card{min-width:135px;width:135px;background:#181818;border-radius:8px;overflow:hidden;position:relative;border:1px solid #222;flex-shrink:0}.card img{width:100%;height:180px;object-fit:cover}.badge{position:absolute;top:5px;left:5px;background:#0f0;color:#000;font-size:8px;font-weight:900;padding:2px 5px;border-radius:3px}.tala{background:#0f0;color:#000;border:none;width:100%;margin-top:4px;padding:6px;border-radius:5px;font-weight:900;font-size:10px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px}.row{display:flex;gap:10px;overflow-x:auto;padding:10px}.modal{position:fixed;inset:0;background:#000;z-index:100;display:none;flex-direction:column}.top{padding:10px;display:flex;justify-content:space-between;background:#111}.close{background:#222;color:#fff;border:1px solid #444;padding:5px 10px;border-radius:15px}.wrap{flex:1}.wrap iframe{width:100%;height:100%;border:none}</style></head><body>
<div style="padding:12px;text-align:center;background:#111;margin:10px;border-radius:10px;border:1px solid #222"><h3 style="color:#0f0">▶️ TALA = FILM COMPLET EZO BETA!</h3><p style="font-size:11px;color:#888">Cliquez TALA - vrai film Lingala ezo banda!</p></div>
<div id="rows"></div><div class="grid" id="grid"></div>
<div id="vm" class="modal"><div class="top"><span id="vt">🎬 Playing</span><button class="close" onclick="cl()">✕ Fermer</button></div><div class="wrap"><iframe id="vf" allowfullscreen allow="autoplay;encrypted-media"></iframe></div><div style="padding:10px;background:#111"><h4 id="vn"></h4><button onclick="cl()" style="background:#0f0;color:#000;border:none;padding:6px 15px;border-radius:15px;margin-top:6px;font-weight:bold">⬅️ Retour</button></div></div>
<div id="lk" class="lock"><h1 style="color:#0f0">🔒 TOMBOLA CINEMA</h1><h2 style="margin:6px 0">2000+ REAL MOVIES</h2><p style="color:#aaa;font-size:12px">TALA = Full movie ezo beta!</p><p style="color:#0f0;font-weight:bold;margin-top:6px">+243 823 043 089</p><input id="cd" class="code" value="TMB-1234"><button class="unlock" onclick="un()">FUNGOLA - TALA FILMS ▶️</button><p onclick="un()" style="color:#0f0;margin-top:10px;text-decoration:underline">👉 TAP ICI - DEMO</p></div>
<script>
T=["Rambo Lingala","Bolingo","Motema Mabe","Mama Congo","Superman Congo","Batman Kin","Action Force","Congo War","Elengi","Bana Kin","Mboka","Nollywood King","Guerre","Sorcellerie","Ndoki","Eglise","Mafia Kin","Police","Famille","Mariage"];I=["https://images.unsplash.com/photo-1485846234645-a62644f84728?w=300","https://images.unsplash.com/photo-1536440136628-849c177e76a1?w=300","https://images.unsplash.com/photo-1509343256512-d77a5cb3791b?w=300","https://images.unsplash.com/photo-1594909771206-00293185ed28?w=300","https://images.unsplash.com/photo-1574267432553-4b4628081c31?w=300"];M=[];for(i=1;i<=2000;i++){M.push({t:T[Math.floor(Math.random()*T.length)]+" "+(i%100+1),im:I[Math.floor(Math.random()*I.length)]+"?r="+i})}vis=60;F=M;
function c(m){return `<div class=card><span class=badge>LINGALA</span><img src="${m.im}" loading=lazy><div style=padding:6px><div style=font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis>${m.t}</div><button class=tala onclick="pl('${m.t}')">▶️ TALA FULL</button></div></div>`}
function render(){let r=document.getElementById('rows');r.innerHTML="<div style=padding:8px 10px;font-weight:bold>🔥 Films ya Sika</div><div class=row>"+M.slice(0,15).map(c).join('')+"</div><div style=padding:8px 10px;font-weight:bold>💥 Action Lingala</div><div class=row>"+M.slice(15,30).map(c).join('')+"</div>";g();}function g(){let e=document.getElementById('grid');e.innerHTML="";F.slice(0,vis).forEach(m=>{let d=document.createElement('div');d.className='card';d.innerHTML=`<span class=badge>LINGALA</span><img src="${m.im}" loading=lazy><div style=padding:6px><div style=font-size:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap>${m.t}</div><button class=tala onclick="pl('${m.t}')">▶️ TALA</button></div>`;e.appendChild(d);});}
function pl(t){document.getElementById('vm').style.display='flex';document.getElementById('vn').innerText=t+" - Lingala Complet 🇨🇩";document.getElementById('vt').innerText="🎬 "+t;let q=encodeURIComponent(t+" film congolais lingala complet");document.getElementById('vf').src="https://www.youtube.com/embed?listType=search&list="+q+"&autoplay=1";}function cl(){document.getElementById('vm').style.display='none';document.getElementById('vf').src="";}function un(){localStorage.setItem('r','1');document.getElementById('lk').style.display='none';}if(localStorage.getItem('r')=='1'){document.getElementById('lk').style.display='none';}render();
</script></body></html>
