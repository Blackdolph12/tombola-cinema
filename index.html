<!DOCTYPE html><html lang="ln"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TOMBOLA CINEMA REAL</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#000;color:#fff;font-family:Arial;overflow-x:hidden}.head{padding:12px 15px;display:flex;justify-content:space-between;align-items:center;background:#000;border-bottom:1px solid #222;position:sticky;top:0;z-index:10}.logo{color:#e50914;font-weight:900;font-size:20px}.logo b{color:#00ff00;font-size:12px}.banner{margin:10px;padding:12px;background:linear-gradient(90deg,#111,#222);border-radius:10px;border:1px solid #333;text-align:center}.rowt{padding:10px;font-weight:900;font-size:14px}.row{display:flex;gap:10px;overflow-x:auto;padding:0 10px 10px;scrollbar-width:none}.row::-webkit-scrollbar{display:none}.card{min-width:140px;width:140px;background:#181818;border-radius:8px;overflow:hidden;border:1px solid #222;flex-shrink:0;position:relative}.card img{width:100%;height:200px;object-fit:cover;background:#111}.badge{position:absolute;top:6px;left:6px;background:#00ff00;color:#000;font-size:9px;font-weight:900;padding:3px 6px;border-radius:4px}.info{padding:6px}.info h4{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tala{background:#00ff00;color:#000;border:none;width:100%;padding:7px;border-radius:6px;font-weight:900;margin-top:5px;font-size:11px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px}.modal{position:fixed;inset:0;background:#000;z-index:99;display:none;flex-direction:column}.mtop{padding:12px;background:#111;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #222}.mwrap{flex:1;background:#000}.mwrap iframe{width:100%;height:100%;border:none}.lock{position:fixed;inset:0;background:#000;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center}.inp{width:100%;max-width:300px;padding:12px;border-radius:8px;border:1px solid #444;background:#111;color:#fff;text-align:center;margin:10px 0}.btn{background:#00ff00;color:#000;border:none;padding:12px 30px;border-radius:25px;font-weight:900;width:100%;max-width:300px}</style></head><body>
<div class="head"><div class="logo">TOMBOLA <b>🇨🇩 2000 FILMS</b></div><div style="font-size:11px;color:#0f0">● LIVE</div></div>
<div class="banner"><h3 style="color:#0f0">▶️ TALA = VRAI FILM EZO BETA SIKOYO! 🎬</h3><p style="font-size:11px;color:#888;margin-top:4px">Cliquez TALA - film complet Lingala sur YouTube</p></div>
<div id="rows"></div><div class="rowt">Tous les Films (2000+) 🇨🇩</div><div class="grid" id="grid"></div><button onclick="more()" style="background:#222;color:#fff;border:1px solid #444;width:90%;margin:15px 5%;padding:12px;border-radius:25px">Charger Plus ⬇️</button>
<div id="vp" class="modal"><div class="mtop"><span id="vt">🎬 Lecture</span><button onclick="closeV()" style="background:#222;color:#fff;border:1px solid #444;padding:6px 12px;border-radius:15px">✕ Fermer</button></div><div class="mwrap"><iframe id="vf" allowfullscreen allow="autoplay;encrypted-media"></iframe></div><div style="padding:10px;background:#111"><h4 id="vn"></h4><p style="font-size:11px;color:#888">Tombola Cinema • Lingala 100% • HD</p></div></div>
<div id="lk" class="lock"><h1 style="color:#0f0;font-size:26px">🔒 TOMBOLA CINEMA</h1><p style="margin:8px 0">2000+ FILMS LINGALA</p><p style="color:#0f0;font-weight:bold">+243 823 043 089</p><input id="cd" class="inp" value="TMB-1234"><button class="btn" onclick="un()">FUNGOLA FILMS ▶️</button><p onclick="un()" style="color:#0f0;margin-top:12px;text-decoration:underline">👉 TAP ICI POUR ENTRER</p></div>
<script>
T=["Rambo Lingala","Bolingo","Motema Mabe","Mama Congo","Batman Kin","Superman Congo","Action Force","Congo War","Elengi Ya Bolingo","Bana Kin","Mboka Monene","Nollywood King","Guerre Ya Mboka","Sorcellerie","Ndoki Film","Eglise Ya Nzambe","Mafia Kinshasa","Police Ya Congo","Famille Sacrée","Mariage Congolais","Goma Love","Virunga","Koffi Action","Fally Film"];P=["https://images.unsplash.com/photo-1485846234645-a62644f84728?w=400","https://images.unsplash.com/photo-1536440136628-849c177e76a1?w=400","https://images.unsplash.com/photo-1509343256512-d77a5cb3791b?w=400","https://images.unsplash.com/photo-1594909771206-00293185ed28?w=400","https://images.unsplash.com/photo-1574267432553-4b4628081c31?w=400","https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?w=400","https://images.unsplash.com/photo-1440404653325-ab127d49abc1?w=400","https://images.unsplash.com/photo-1478720568477-152d9b164e26?w=400"];M=[];for(i=1;i<=2000;i++){M.push({id:i,t:T[Math.floor(Math.random()*T.length)]+" "+(i%95+1),p:P[Math.floor(Math.random()*P.length)]+"&q=80&auto=format&fit=crop&random="+i})}F=M;vis=60;
function card(m){return `<div class=card><span class=badge>🇨🇩 LINGALA</span><img src="${m.p}" loading=lazy onerror="this.src='https://picsum.photos/140/200?random=${m.id}'"><div class=info><h4>${m.t}</h4><button class=tala onclick="playV('${m.t}')">▶️ TALA</button></div></div>`}
function render(){let r=document.getElementById('rows');r.innerHTML=`<div class=rowt>🔥 Films ya Sika</div><div class=row>${M.slice(0,12).map(card).join('')}</div><div class=rowt>💥 Action Lingala</div><div class=row>${M.slice(12,24).map(card).join('')}</div><div class=rowt>❤️ Bolingo</div><div class=row>${M.slice(24,36).map(card).join('')}</div>`;grid();}
function grid(){let g=document.getElementById('grid');g.innerHTML="";F.slice(0,vis).forEach(m=>{let d=document.createElement('div');d.className='card';d.innerHTML=`<span class=badge>LINGALA</span><img src="${m.p}" loading=lazy onerror="this.src='https://picsum.photos/140/200?random=${m.id}'"><div class=info><h4>${m.t}</h4><button class=tala onclick="playV('${m.t}')">▶️ TALA</button></div>`;g.appendChild(d);});}
function more(){vis+=60;grid();}
function playV(t){document.getElementById('vp').style.display='flex';document.getElementById('vn').innerText=t+" - Film Complet Lingala 🇨🇩";document.getElementById('vt').innerText="🎬 "+t;let q=encodeURIComponent(t+" film congolais complet lingala");document.getElementById('vf').src="https://www.youtube.com/embed?listType=search&list="+q+"&autoplay=1";}
function closeV(){document.getElementById('vp').style.display='none';document.getElementById('vf').src="";}
function un(){localStorage.setItem('ok','1');document.getElementById('lk').style.display='none';}
if(localStorage.getItem('ok')=='1'){document.getElementById('lk').style.display='none';}
render();
</script></body></html>
